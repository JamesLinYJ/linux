# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/pwm/esp,esp32s3-ledc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S3 LED PWM controller

maintainers:
  - ESP32-S3 Linux project <noreply@example.invalid>

description: |
  The ESP32-S3 LEDC block provides eight low-speed PWM channels backed by
  four timers. Channels can use independent periods while a timer is free;
  channels sharing a timer must use the same period.

allOf:
  - $ref: pwm.yaml#

properties:
  compatible:
    const: esp,esp32s3-ledc

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  '#pwm-cells':
    const: 3

required:
  - compatible
  - reg
  - clocks
  - resets
  - '#pwm-cells'

additionalProperties: false

examples:
  - |
    pwm@60019000 {
        compatible = "esp,esp32s3-ledc";
        reg = <0x60019000 0x1000>;
        clocks = <&syscon 4>;
        resets = <&syscon 4>;
        #pwm-cells = <3>;
    };
