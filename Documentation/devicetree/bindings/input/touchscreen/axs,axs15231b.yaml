# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/axs,axs15231b.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AXS Technology AXS15231B In-cell Touchscreen Controller

maintainers:
  - ESP32-S3 Linux project <noreply@example.invalid>

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: axs,axs15231b

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - touchscreen-size-x
  - touchscreen-size-y

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@3b {
            compatible = "axs,axs15231b";
            reg = <0x3b>;
            interrupt-parent = <&gpio_expander>;
            interrupts = <0 IRQ_TYPE_EDGE_FALLING>;
            touchscreen-size-x = <640>;
            touchscreen-size-y = <172>;
        };
    };
