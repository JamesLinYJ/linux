%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/esp,esp32s3-usb-serial-jtag.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S3 USB Serial/JTAG controller

maintainers:
  - Max Filippov <jcmvbkbc@gmail.com>

description: |
  The ESP32-S3 USB Serial/JTAG controller exposes a USB serial endpoint and a
  JTAG bridge. Linux uses the serial endpoint for early console and normal TTY
  operation. The ROM leaves the integrated USB PHY and device controller in a
  usable state; this node does not control the JTAG bridge or PHY routing.

allOf:
  - $ref: serial.yaml#

properties:
  compatible:
    const: esp,esp32s3-usb-serial-jtag

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    serial@60038000 {
        compatible = "esp,esp32s3-usb-serial-jtag";
        reg = <0x60038000 0x1000>;
        interrupts = <96 IRQ_TYPE_LEVEL_HIGH>;
    };
