%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/esp,esp32s3-usb-serial-jtag.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S3 USB Serial/JTAG controller

maintainers:
  - Max Filippov <jcmvbkbc@gmail.com>

description: |
  The ESP32-S3 USB Serial/JTAG controller exposes a USB serial endpoint and a
  JTAG bridge. The initial binding supports polling-only early console output;
  interrupt and clock properties will be specified with the runtime driver.

allOf:
  - $ref: serial.yaml#

properties:
  compatible:
    const: esp,esp32s3-usb-serial-jtag

  reg:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    serial@60038000 {
        compatible = "esp,esp32s3-usb-serial-jtag";
        reg = <0x60038000 0x1000>;
    };
