%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/everest,es7210.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Everest ES7210 4-channel ADC codec

maintainers:
  - ESP32-S3 Linux project <noreply@example.invalid>

description: |
  Everest ES7210 4-channel audio ADC controlled over I2C. The 7-bit
  slave address is 0x40 when AD1/AD0 are both low. The codec consumes
  MCLK and I2S clocks from the SoC (clock consumer role). The Waveshare
  ESP32-S3-Touch-LCD-3.49 V2 wires it to I2C0 and the ESP32-S3 I2S0
  controller.

properties:
  compatible:
    const: everest,es7210

  reg:
    maxItems: 1

  clocks:
    items:
      - description: codec master clock (MCLK)

  clock-names:
    const: mclk

required:
  - compatible
  - reg
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        codec@40 {
            compatible = "everest,es7210";
            reg = <0x40>;
            clocks = <&codec_mclk>;
            clock-names = "mclk";
        };
    };
...
