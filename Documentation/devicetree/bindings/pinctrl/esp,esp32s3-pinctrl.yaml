# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/esp,esp32s3-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S3 GPIO and pin controller

maintainers:
  - ESP32-S3 Linux project <noreply@example.invalid>

description:
  The ESP32-S3 GPIO block combines GPIO data and interrupt control with an
  I/O multiplexer and a matrix that routes peripheral signals to pads.

properties:
  compatible:
    const: esp,esp32s3-pinctrl

  reg:
    items:
      - description: GPIO and signal matrix registers
      - description: I/O multiplexer registers

  reg-names:
    items:
      - const: gpio
      - const: iomux

  gpio-controller: true

  '#gpio-cells':
    const: 2

  gpio-ranges:
    maxItems: 1

  gpio-reserved-ranges: true

  interrupt-controller: true

  '#interrupt-cells':
    const: 2

  interrupts:
    maxItems: 1

patternProperties:
  '-pins$':
    type: object
    allOf:
      - $ref: pinmux-node.yaml#
      - $ref: pincfg-node.yaml#

    properties:
      pins:
        items:
          pattern: '^gpio([0-9]|[1-3][0-9]|4[0-8])$'
          not:
            enum: [ gpio22, gpio23, gpio24, gpio25 ]

      function:
        enum:
          - gpio
          - i2c0-scl
          - i2c0-sda
          - i2c1-scl
          - i2c1-sda
          - spi3-clk
          - spi3-cs0
          - spi3-d
          - spi3-hd
          - spi3-q
          - spi3-wp

      bias-disable: true
      bias-pull-up: true
      bias-pull-down: true
      drive-open-drain: true
      drive-push-pull: true
      input-enable: true
      input-disable: true

    required:
      - pins
      - function

    additionalProperties: false

required:
  - compatible
  - reg
  - reg-names
  - gpio-controller
  - '#gpio-cells'
  - gpio-ranges
  - interrupt-controller
  - '#interrupt-cells'
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    pinctrl: pinctrl@60004000 {
        compatible = "esp,esp32s3-pinctrl";
        reg = <0x60004000 0x700>, <0x60009000 0x100>;
        reg-names = "gpio", "iomux";
        interrupt-parent = <&intc>;
        interrupts = <16 IRQ_TYPE_LEVEL_HIGH>;
        gpio-controller;
        #gpio-cells = <2>;
        gpio-ranges = <&pinctrl 0 0 49>;
        interrupt-controller;
        #interrupt-cells = <2>;

        i2c0-pins {
            pins = "gpio47", "gpio48";
            function = "gpio";
            bias-pull-up;
            drive-open-drain;
            input-enable;
        };
    };
