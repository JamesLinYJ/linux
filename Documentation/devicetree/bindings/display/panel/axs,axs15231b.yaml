# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/axs,axs15231b.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AXS Technology AXS15231B 172x640 QSPI command-mode LCD panel

maintainers:
  - ESP32-S3 Linux project <noreply@example.invalid>

description: |
  The AXS15231B is a 172x640 in-cell touch LCD controller. In QSPI mode
  (hardware pin IM[3:0] strapped to 1010) the host drives the panel over
  quad SPI with a 4-byte single-line command phase in SPI mode 3. The
  Waveshare ESP32-S3-Touch-LCD-3.49 V2 connects it to SPI3 at 40 MHz with
  an active-low reset line on a TCA9554 I/O expander.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: axs,axs15231b

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 40000000

  spi-cpha: true
  spi-cpol: true

  reset-gpios:
    maxItems: 1
    description: active-low panel reset line

required:
  - compatible
  - reg
  - spi-max-frequency
  - spi-cpha
  - spi-cpol

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "axs,axs15231b";
            reg = <0>;
            spi-max-frequency = <40000000>;
            spi-cpha;
            spi-cpol;
            reset-gpios = <&ioexpander 5 GPIO_ACTIVE_LOW>;
            backlight = <&lcd_backlight>;
        };
    };
...
