# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/esp,esp32s3-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S3 I2C controller

maintainers:
  - ESP32-S3 Linux project <noreply@example.invalid>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: esp,esp32s3-i2c

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  interrupts:
    maxItems: 1

  clock-frequency:
    default: 100000
    minimum: 10000
    maximum: 1000000

required:
  - compatible
  - reg
  - clocks
  - resets
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/esp32s3.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/reset/esp32s3.h>

    i2c@60013000 {
        compatible = "esp,esp32s3-i2c";
        reg = <0x60013000 0x1000>;
        clocks = <&syscon ESP32S3_CLK_I2C0>;
        resets = <&syscon ESP32S3_RST_I2C0>;
        interrupts = <42 IRQ_TYPE_LEVEL_HIGH>;
        clock-frequency = <400000>;
        #address-cells = <1>;
        #size-cells = <0>;
    };
