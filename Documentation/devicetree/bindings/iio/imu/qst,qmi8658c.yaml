%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/imu/qst,qmi8658c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: QST QMI8658C 6-axis inertial measurement unit

maintainers:
  - ESP32-S3 Linux project <noreply@example.invalid>

description: |
  QST QMI8658C 6-axis IMU (3-axis accelerometer and 3-axis gyroscope)
  with an I2C interface. When SA0 is pulled up or left unconnected the
  7-bit slave address is 0x6A; pulling it down selects 0x6B. The
  Waveshare ESP32-S3-Touch-LCD-3.49 V2 wires INT1 to TCA9554 EXIO2 and
  INT2 to EXIO3.

properties:
  compatible:
    const: qst,qmi8658c

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 2
    description: |
      INT1 and INT2 interrupt lines, in that order. The driver currently
      polls the STATUS0 new-data flags and does not request these
      interrupts; they are reserved for the planned triggered-buffer
      support on INT2.

  drive-open-drain:
    type: boolean

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        imu@6a {
            compatible = "qst,qmi8658c";
            reg = <0x6a>;
            interrupt-parent = <&ioexpander>;
            interrupts = <2 IRQ_TYPE_EDGE_FALLING>,
                         <3 IRQ_TYPE_EDGE_FALLING>;
        };
    };
...
