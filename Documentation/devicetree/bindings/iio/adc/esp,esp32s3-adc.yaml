# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/esp,esp32s3-adc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S3 ADC1

maintainers:
  - ESP32-S3 Linux project <noreply@example.invalid>

description:
  The ESP32-S3 ADC1 provides ten single-ended channels on GPIO1 through
  GPIO10. This binding describes channels used with the RTC one-shot
  controller. Continuous conversions through the digital controller and
  GDMA are outside this binding.

properties:
  compatible:
    const: esp,esp32s3-adc

  reg:
    items:
      - description: SENS registers
      - description: Shared analog configuration registers

  reg-names:
    items:
      - const: sens
      - const: analog

  pinctrl-names:
    const: default

  pinctrl-0: true

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

  '#io-channel-cells':
    const: 1

patternProperties:
  '^channel@[0-9]$':
    $ref: adc.yaml

    properties:
      reg:
        minimum: 0
        maximum: 9

      esp,attenuation:
        $ref: /schemas/types.yaml#/definitions/uint32
        enum: [0, 1, 2, 3]
        description:
          Hardware attenuation encoding. Values 0, 1, 2 and 3 select
          approximately 0 dB, 2.5 dB, 6 dB and 12 dB respectively.

    required:
      - reg
      - esp,attenuation

    additionalProperties: false

required:
  - compatible
  - reg
  - reg-names
  - pinctrl-names
  - pinctrl-0
  - '#address-cells'
  - '#size-cells'
  - '#io-channel-cells'

additionalProperties: false

examples:
  - |
    adc@60008800 {
        compatible = "esp,esp32s3-adc";
        reg = <0x60008800 0x200>, <0x6000e000 0x100>;
        reg-names = "sens", "analog";
        pinctrl-names = "default";
        pinctrl-0 = <&adc1_channel3_pin>;
        #address-cells = <1>;
        #size-cells = <0>;
        #io-channel-cells = <1>;

        channel@3 {
            reg = <3>;
            esp,attenuation = <2>;
            label = "battery-divider";
        };
    };
