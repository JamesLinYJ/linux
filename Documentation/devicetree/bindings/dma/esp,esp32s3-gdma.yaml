# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/esp,esp32s3-gdma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S3 general DMA controller

maintainers:
  - ESP32-S3 Linux project <noreply@example.invalid>

description:
  The ESP32-S3 GDMA controller has five pairs of independently routed receive
  and transmit channels. Hardware link descriptors must reside in internal
  DMA-capable SRAM, supplied through a dedicated shared DMA pool.

allOf:
  - $ref: dma-controller.yaml#

properties:
  compatible:
    const: esp,esp32s3-gdma

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  interrupts:
    minItems: 10
    maxItems: 10

  interrupt-names:
    items:
      - const: rx0
      - const: rx1
      - const: rx2
      - const: rx3
      - const: rx4
      - const: tx0
      - const: tx1
      - const: tx2
      - const: tx3
      - const: tx4

  memory-region:
    maxItems: 1
    description:
      Shared DMA pool in internal SRAM used exclusively for hardware link
      descriptors.

  dma-channels:
    const: 10

  dma-requests:
    const: 10

  '#dma-cells':
    const: 2
    description: |
      The first cell selects a peripheral trigger from
      dt-bindings/dma/esp32s3-gdma.h. The second cell selects RX or TX using
      ESP32S3_GDMA_DIR_RX or ESP32S3_GDMA_DIR_TX from the same header.

required:
  - compatible
  - reg
  - clocks
  - resets
  - interrupts
  - interrupt-names
  - memory-region
  - dma-channels
  - dma-requests
  - '#dma-cells'

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/esp32s3.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/reset/esp32s3.h>

    reserved-memory {
        #address-cells = <1>;
        #size-cells = <1>;
        ranges;

        dma_pool: dma-pool@3fc88000 {
            compatible = "shared-dma-pool";
            reg = <0x3fc88000 0x8000>;
            no-map;
        };
    };

    dma-controller@6003f000 {
        compatible = "esp,esp32s3-gdma";
        reg = <0x6003f000 0x1000>;
        clocks = <&syscon ESP32S3_CLK_GDMA>;
        resets = <&syscon ESP32S3_RST_GDMA>;
        interrupts = <65 IRQ_TYPE_LEVEL_HIGH>,
                     <66 IRQ_TYPE_LEVEL_HIGH>,
                     <67 IRQ_TYPE_LEVEL_HIGH>,
                     <68 IRQ_TYPE_LEVEL_HIGH>,
                     <69 IRQ_TYPE_LEVEL_HIGH>,
                     <70 IRQ_TYPE_LEVEL_HIGH>,
                     <71 IRQ_TYPE_LEVEL_HIGH>,
                     <72 IRQ_TYPE_LEVEL_HIGH>,
                     <73 IRQ_TYPE_LEVEL_HIGH>,
                     <74 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "rx0", "rx1", "rx2", "rx3", "rx4",
                          "tx0", "tx1", "tx2", "tx3", "tx4";
        memory-region = <&dma_pool>;
        dma-channels = <10>;
        dma-requests = <10>;
        #dma-cells = <2>;
    };
