%YAML 1.2
---
$id: http://devicetree.org/schemas/xtensa/cpus.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xtensa CPUs

maintainers:
  - Max Filippov <jcmvbkbc@gmail.com>

allOf:
  - $ref: /schemas/cpu.yaml#

properties:
  compatible:
    const: cdns,xtensa-cpu

  device_type:
    const: cpu

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - device_type
  - reg

unevaluatedProperties: false

examples:
  - |
    cpu@0 {
        compatible = "cdns,xtensa-cpu";
        device_type = "cpu";
        reg = <0>;
    };
